[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peoplecomfort"
version = "0.2.0"
description = "Multi-zone spatial capacity evaluation with scenario comparison and optional CBE thermal calculations"
requires-python = ">=3.11"
license = {text = "GPL-2.0"}
dependencies = []

[project.scripts]
peoplecomfort = "peoplecomfort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peoplecomfort = ["_cbe/*", "web/*", "web/docs/*", "web/docs/cbe/*", "web/docs/workflow/*", "web/docs/api/*", "web/docs/cli/*", "data/*"]
